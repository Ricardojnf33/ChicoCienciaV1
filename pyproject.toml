[tool.poetry]
name = "ChicoCienciaV1"
version = "0.1.0"
description = "AI Scientist v2-style project using CrewAI and Agentic Tree Search"
authors = ["Ricardo Fernandes (Ricardojnf33) <ricardo.jnf1@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
crewai = "^0.51.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.5.2"
typer = "^0.12.0"
click = ">=8.1.7,<8.2.0"
structlog = "^24.1.0"
sqlmodel = "^0.0.16"
aiosqlite = "^0.20.0"
polars = "^1.4.0"
numpy = "^1.26.0"
scikit-learn = "^1.5.0"
matplotlib = "^3.8.0"
pillow = "^10.3.0"
arxiv = "^2.1.0"
semanticscholar = "^0.7.0"
crossrefapi = "^1.6.0"
tiktoken = "^0.7.0"
tenacity = ">=8.2.3,<9.0.0"
pyyaml = "^6.0.1"
python-dotenv = "^1.0.1"
wandb = "^0.17.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ruff = "^0.6.0"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: teste que acessa um serviço externo e requer credenciais",
]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
