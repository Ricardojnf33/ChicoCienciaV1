name: CI
on: [push, pull_request]
permissions:
  contents: read
env:
  OTEL_SDK_DISABLED: "true"
  ORT_DISABLE_TELEMETRY: "1"
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry==2.2.1
      - name: Install deps
        run: poetry install --no-interaction
      - name: Validate lock
        run: poetry check --lock
      - name: Lint
        run: poetry run ruff check src tests
      - name: Tests
        run: poetry run pytest -q --junitxml=test-results/offline.xml
      - name: Preserve offline test report
        if: always() && hashFiles('test-results/offline.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: offline-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/offline.xml
          if-no-files-found: error
          retention-days: 90
